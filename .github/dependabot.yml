version: 2
updates:
  # Frontend npm deps.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # Backend Python deps.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  # Engine Python deps.
  - package-ecosystem: "pip"
    directory: "/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      engine-minor-patch:
        update-types: ["minor", "patch"]

  # Base images in the per-service Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/engine"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        update-types: ["minor", "patch"]

  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]
