version: 2
# Monthly, grouped updates: at most one minor/patch PR and one major PR per
# ecosystem. The frontend toolchain is pinned on purpose (see docs/DEVELOPMENT.md),
# so its major versions are upgraded by hand rather than by Dependabot.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
      frontend-major:
        update-types: ["major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # arq 0.28 requires redis<6; move both together by hand.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
      backend-major:
        update-types: ["major"]

  - package-ecosystem: "pip"
    directory: "/engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      engine-minor-patch:
        update-types: ["minor", "patch"]
      engine-major:
        update-types: ["major"]

  - package-ecosystem: "docker"
    directories:
      - "/engine"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "monthly"
    groups:
      docker-images:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
