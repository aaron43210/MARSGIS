name: Build and Publish All-in-One Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.allinone"
      - "docker/nginx-allinone.conf"
      - "docker/start-allinone.sh"
      - "frontend/**"
      - "backend/**"
      - "engine/**"
      - "contracts/**"
      - ".github/workflows/allinone.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  allinone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/marsgis:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/marsgis:${{ github.sha }}
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,mode=max,scope=allinone
