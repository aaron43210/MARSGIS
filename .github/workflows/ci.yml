name: CI

on:
  pull_request:
  push:
    branches: ["master", "main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build mars-globe
        run: |
          cd ../packages/mars-globe
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend + engine (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./engine[dev]"
          pip install -e "./backend[dev]"
      - name: Ruff lint
        run: ruff check backend engine
      - name: Ruff format check
        run: ruff format --check backend engine
      - name: Pytest engine
        run: pytest engine/tests -v
      - name: Pytest backend
        run: pytest backend/tests -v -o asyncio_mode=auto

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          load: true
          tags: marsgis-engine:ci
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: Smoke-test engine CLI
        run: docker run --rm marsgis-engine:ci --help
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: marsgis-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          tags: marsgis-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
