[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marsgis-engine"
description = "MarsGIS science engine: Spectral Angle Mapper on CRISM MTRDR cubes (candidate matches, not confirmed deposits)."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "MarsGIS"}]
keywords = ["mars", "crism", "hyperspectral", "spectral-angle-mapper", "mtrdr", "cog"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3,<2",
    "spectral>=0.23",
    "scipy>=1.10",
    "affine>=2.3",
]

[project.optional-dependencies]
# Reserved for future supervised classifiers; NOT required by SAM.
ml = ["scikit-learn>=1.3"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "jsonschema>=4",
    "ruff",
    "mypy",
    "build",
]

[project.scripts]
marsgis-engine = "marsgis_engine.cli:main"

[project.urls]
Homepage = "https://github.com/marsgis/marsgis"
Source = "https://github.com/marsgis/marsgis"

[tool.setuptools.dynamic]
version = {attr = "marsgis_engine._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marsgis_engine = [
    "py.typed",
    "data/minerals.json",
    "data/mica/*.tab",
    "data/mica/*.lbl",
    "data/mica/NOTICE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (deselected by default)",
]
addopts = "-q -m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["marsgis_engine"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
