<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="MarsGIS — interactive CesiumJS Mars globe for CRISM MTRDR spectral analysis (SAM). Candidate matches only; not confirmed mineral deposits."
    />
    <title>MarsGIS</title>
    <style>
      /* Dark default so the WebGL canvas never flashes white before React mounts. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0e14;
        color: #e6e9ef;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8b93a7;
        font-size: 14px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">Loading Mars globe…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
