# GENERATED from backend/app/schemas via contracts/gen_openapi.py - do not hand-edit.
openapi: 3.1.0
info:
  title: MarsGIS API
  version: 1.0.0
  description: Shared REST contract for MarsGIS (frontend/backend/engine). Coordinates are Mars IAU 2000
    degrees, not Earth WGS84. Generated from backend/app/schemas (Pydantic) - do not hand-edit components.
servers:
- url: http://localhost:8000
  description: local dev
- url: /
  description: same-origin (containerized)
tags:
- name: system
- name: map
- name: catalog
- name: analysis
paths:
  /api/health:
    get:
      tags:
      - system
      operationId: getHealth
      summary: Liveness/readiness + component status + implemented algorithms.
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/layers:
    get:
      tags:
      - map
      operationId: listLayers
      summary: Catalog of base + overlay map layers (incl. VERIFIED NASA Trek basemaps).
      parameters:
      - name: type
        in: query
        required: false
        description: filter by layer type
        schema:
          type: string
          enum:
          - basemap
          - wmts
          - xyz
          - result_tiles
          - geojson_overlay
      - name: is_base
        in: query
        required: false
        description: only base / only overlay layers
        schema:
          type: boolean
      - name: availability
        in: query
        required: false
        description: filter by availability
        schema:
          type: string
          enum:
          - verified
          - unconfirmed
          - unavailable
      responses:
        '200':
          description: Layer catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerList'
  /api/observations:
    get:
      tags:
      - catalog
      operationId: listObservations
      summary: Search observations (paginated).
      parameters:
      - name: instrument
        in: query
        required: false
        description: instrument
        schema:
          type: string
          enum:
          - CRISM
          - CTX
          - HiRISE
          - HRSC
          - OMEGA
          - THEMIS
          - MOLA
      - name: product_type
        in: query
        required: false
        description: product type
        schema:
          type: string
          enum:
          - MTRDR
          - TRDR
          - DDR
          - MOSAIC
          - DEM
          - ORTHOIMAGE
          - BASEMAP
      - name: region
        in: query
        required: false
        description: named region, e.g. 'Nili Fossae'
        schema:
          type: string
      - name: bbox
        in: query
        required: false
        description: spatial filter 'west,south,east,north' (Mars deg)
        schema:
          type: string
      - name: suitable
        in: query
        required: false
        description: only analysis_suitable observations
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        description: free-text match on id/title
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: page size (default 50, max 200)
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: page offset
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: sort key
        schema:
          type: string
          enum:
          - acquired_at
          - -acquired_at
          - id
          - resolution_m
          - -resolution_m
      responses:
        '200':
          description: Matching observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'
        '422': &id002
          $ref: '#/components/responses/ValidationError'
  /api/observations/{id}:
    get:
      tags:
      - catalog
      operationId: getObservation
      summary: Full observation record.
      parameters:
      - name: id
        in: path
        required: true
        description: native observation id
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Observation'
        '404': &id001
          $ref: '#/components/responses/NotFound'
  /api/minerals:
    get:
      tags:
      - catalog
      operationId: listMinerals
      summary: Spectral reference library summaries (no sample arrays).
      parameters:
      - name: class
        in: query
        required: false
        description: mineral class
        schema:
          type: string
          enum:
          - carbonate
          - olivine
          - phyllosilicate
          - pyroxene
          - sulfate
          - iron_oxide
          - hydrated_silica
          - other
      - name: source
        in: query
        required: false
        description: library source
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: free-text match
        schema:
          type: string
      responses:
        '200':
          description: Reference library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MineralList'
  /api/minerals/{id}:
    get:
      tags:
      - catalog
      operationId: getMineral
      summary: Full reference spectrum incl. wavelength[]/reflectance[].
      parameters:
      - name: id
        in: path
        required: true
        description: reference id
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectralReference'
        '404': *id001
  /api/analysis-jobs:
    get:
      tags:
      - analysis
      operationId: listJobs
      summary: List jobs (paginated).
      parameters:
      - name: status
        in: query
        required: false
        description: filter by status
        schema:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
      - name: observation_id
        in: query
        required: false
        description: filter by observation
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: page size
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: page offset
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
    post:
      tags:
      - analysis
      operationId: createJob
      summary: Create an analysis job (async). Returns 202 queued.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: optional dedupe key
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisJobCreate'
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
          headers:
            Location:
              description: job resource url
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404': *id001
        '422': *id002
  /api/analysis-jobs/{id}:
    get:
      tags:
      - analysis
      operationId: getJob
      summary: Poll job status/progress; result_id set when succeeded, error when failed.
      parameters:
      - name: id
        in: path
        required: true
        description: job id
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404': *id001
  /api/results/{id}:
    get:
      tags:
      - analysis
      operationId: getResult
      summary: Result incl. rasters, bounds, legend, summary_stats and ready-to-add map_layer.
      parameters:
      - name: id
        in: path
        required: true
        description: result id
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '404': *id001
  /api/results/{id}/download:
    get:
      tags:
      - analysis
      operationId: downloadResult
      summary: Download a result raster asset as a Cloud-Optimized GeoTIFF.
      parameters:
      - name: id
        in: path
        required: true
        description: result id
        schema:
          type: string
      - name: asset
        in: query
        required: false
        description: which raster
        schema:
          type: string
          enum:
          - primary_metric
          - sam_angle
          - detection_mask
          - match_score
      responses:
        '200':
          description: COG
          content:
            image/tiff; application=geotiff; profile=cloud-optimized:
              schema:
                type: string
                format: binary
        '404': *id001
  /api/results/{id}/tiles/{z}/{x}/{y}.png:
    get:
      tags:
      - analysis
      - map
      operationId: getResultTile
      summary: Rendered PNG tile (geographic scheme, 2x1@z0, zxy) for Cesium overlay.
      parameters:
      - name: id
        in: path
        required: true
        description: result id
        schema:
          type: string
      - name: z
        in: path
        required: true
        description: zoom
        schema:
          type: integer
      - name: x
        in: path
        required: true
        description: column
        schema:
          type: integer
      - name: y
        in: path
        required: true
        description: row (north origin)
        schema:
          type: integer
      - name: colormap
        in: query
        required: false
        description: override colormap
        schema:
          type: string
      - name: rescale
        in: query
        required: false
        description: override value range 'min,max'
        schema:
          type: string
      responses:
        '200':
          description: tile
          content:
            image/png:
              schema:
                type: string
                format: binary
        '204':
          description: empty tile (no coverage)
        '404': *id001
  /api/provenance/{id}:
    get:
      tags:
      - analysis
      operationId: getProvenance
      summary: Reproducibility record for a result (software versions, source ids, steps).
      parameters:
      - name: id
        in: path
        required: true
        description: provenance id (from AnalysisResult.provenance_id)
        schema:
