# Pre-commit — commit-time quality + security + "no bulk data" enforcement.
# Install once:  pre-commit install   (run all: make precommit)
# CI re-runs the same hooks so they cannot be bypassed.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      # Operationalizes the "no bulk archives" constraint at commit time.
      - id: check-added-large-files
        args: ["--maxkb=256"]

  # Backend + engine: lint & format (ruff pinned to the backend's dev pin).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: ["--fix"]
        files: '^(backend|engine)/.*\.py$'
      - id: ruff-format
        files: '^(backend|engine)/.*\.py$'

  # Frontend: prettier.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: '^frontend/.*\.(ts|tsx|js|jsx|json|css|html)$'

  # Dockerfiles.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: '(^|/)Dockerfile$'

  # Secret scanning.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
