[alembic]
# Alembic configuration for the PostgreSQL/PostGIS production path only.
# The default SQLite dev path uses SQLModel.metadata.create_all (see
# app/db/migrate.py) and does NOT run Alembic.
#
# sqlalchemy.url is intentionally left blank: env.py injects it at runtime from
# app.config.get_settings().sync_database_url so there is a single source of
# truth for the connection string.
script_location = app/alembic
sqlalchemy.url =

prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
